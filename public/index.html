<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family App</title>
<link rel="manifest" href="/manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="/icon-180.png?v=2">
<link rel="icon" href="/favicon.png?v=2">
<meta name="theme-color" content="#FBEFE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family App">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one phone-width column, sunset glow behind soft cards, fixed tab bar with a raised "+" in the middle */
:root{
  --bg:#FBF3EE; --glow1:#FFD3B4; --glow2:#F6C3DA; --glow3:#DCC8F6;
  --card:#FFFFFF; --card2:#FFF6F0; --ink:#221A2E; --muted:#776B82; --line:#F0E2DA;
  --accent:#FF7440; --accent2:#FFB547; --accent-ink:#FFFFFF;
  --pill:#221A2E; --pill-ink:#FFFFFF;
  --good:#23945F; --warn:#C98A0C; --bad:#D4405A;
  --c-blue:#3A74DB; --c-pink:#DB4A79; --c-purple:#8452F0; --c-teal:#0F9895; --c-orange:#E5791A; --c-green:#2E9E4F; --c-red:#D64033; --c-gold:#C08A00; --c-slate:#5B6B82; --c-brown:#8B5A3C;
  --shadow:0 6px 24px -10px rgba(80,40,60,.25);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r-lg:24px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17121D; --glow1:#3B2330; --glow2:#36203A; --glow3:#272043;
  --card:#231C2B; --card2:#2B2335; --ink:#F7EEF4; --muted:#AE9FB9; --line:#382D42;
  --accent:#FF8A5C; --accent2:#FFC266; --accent-ink:#1B1220;
  --pill:#F7EEF4; --pill-ink:#1B1520;
  --good:#4CC28B; --warn:#F0B53D; --bad:#F06A80;
  --c-blue:#77A5F2; --c-pink:#F27FA3; --c-purple:#AC8DFB; --c-teal:#3FC6C1; --c-orange:#F7A659; --c-green:#6CCB86; --c-red:#F07D73; --c-gold:#F2C94C; --c-slate:#97A6BC; --c-brown:#C4936F;
  --shadow:0 6px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121D; --glow1:#3B2330; --glow2:#36203A; --glow3:#272043;
  --card:#231C2B; --card2:#2B2335; --ink:#F7EEF4; --muted:#AE9FB9; --line:#382D42;
  --accent:#FF8A5C; --accent2:#FFC266; --accent-ink:#1B1220;
  --pill:#F7EEF4; --pill-ink:#1B1520;
  --good:#4CC28B; --warn:#F0B53D; --bad:#F06A80;
  --c-blue:#77A5F2; --c-pink:#F27FA3; --c-purple:#AC8DFB; --c-teal:#3FC6C1; --c-orange:#F7A659; --c-green:#6CCB86; --c-red:#F07D73; --c-gold:#F2C94C; --c-slate:#97A6BC; --c-brown:#C4936F;
  --shadow:0 6px 24px -12px rgba(0,0,0,.6); color-scheme:dark}

html,body{min-height:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 40% at 15% 0%,var(--glow1),transparent 70%),radial-gradient(55% 40% at 95% 10%,var(--glow2),transparent 70%),radial-gradient(70% 45% at 50% 105%,var(--glow3),transparent 70%)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px calc(110px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px}
.link{color:var(--accent);font-weight:700;font-size:13px}

.card{background:var(--card);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--card2)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border-radius:var(--r-md);padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.item .grow p{overflow-wrap:anywhere}
.empty{padding:18px;border:2px dashed var(--line);border-radius:var(--r-md);text-align:center;color:var(--muted);font-size:14px}

.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--card);box-shadow:0 0 0 2px var(--pc,var(--line))}
.avatar.sm{width:28px;height:28px;border-width:1.5px}
.avatar.lg{width:64px;height:64px;border-width:3px}
.avatar.ini{display:inline-grid;place-items:center;background:var(--pc,var(--accent));color:#fff;font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1}
.avatar.ini.sm{font-size:12px} .avatar.ini.lg{font-size:28px}
.faces{display:flex}
.faces .avatar{margin-left:-8px}
.faces .avatar:first-child{margin-left:0}

.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-weight:800;font-size:13px;white-space:nowrap}
.pill.dark{background:var(--pill);color:var(--pill-ink)}
.pill.pts{background:color-mix(in srgb,var(--accent2) 26%,var(--card));color:var(--ink)}
.pill.soft{background:var(--card2);color:var(--ink)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,var(--card));color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--warn)}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--pc) 16%,var(--card));color:var(--pc)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:999px;font-weight:800;background:var(--pill);color:var(--pill-ink);min-height:44px}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btn.small{padding:7px 14px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);flex:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.seg button{flex:1;padding:9px 10px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--glow1),var(--glow2));color:var(--ink)}

.banner{border-radius:var(--r-lg);padding:16px 18px;background:linear-gradient(120deg,var(--glow1),var(--glow2) 60%,var(--glow3));display:flex;align-items:center;gap:12px}
.banner h3{font-size:17px}

/* header */
.top{display:flex;align-items:center;gap:12px;padding-block:6px 4px}
.top .who{display:flex;flex-direction:column;min-width:0}
.top .who b{font-family:var(--f-display);font-size:20px;line-height:1.1}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav-inner{pointer-events:auto;max-width:456px;margin:0 auto;background:var(--card);border-radius:28px;box-shadow:0 10px 40px -12px rgba(50,20,50,.35);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 6px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;padding:4px 0;cursor:pointer;position:relative}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"] svg{stroke:var(--accent)}
.nav .plus{justify-self:center;width:52px;height:52px;margin-top:-26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -6px var(--accent)}
.nav .plus svg{width:26px;height:26px;stroke-width:2.6}
.dot{position:absolute;top:0;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;text-align:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,25,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13px;color:var(--muted)}
.input{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:600}
.input:focus{border-color:var(--accent);outline:none}
textarea.input{min-height:72px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:13px}
.chip.noimg{padding:7px 14px}
.chip[aria-pressed="true"]{border-color:var(--pc,var(--accent));background:color-mix(in srgb,var(--pc,var(--accent)) 14%,var(--card))}

/* welcome */
.welcome{display:flex;flex-direction:column;gap:18px;padding-top:8px}
.hero{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:1.1/1;max-width:100%;box-shadow:var(--shadow)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(20,8,20,.65))}
.hero .cap{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;color:#fff}
.hero .cap h1{font-size:34px;color:#fff}
.hero.plain{aspect-ratio:auto;min-height:170px;background:linear-gradient(120deg,var(--glow1),var(--glow2) 55%,var(--glow3))}
.hero.plain::after{display:none}
.hero.plain .cap,.hero.plain .cap h1{color:var(--ink)}
.swatch{width:18px;height:18px;border-radius:50%;background:var(--pc);display:inline-block}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick button{background:var(--card);border-radius:20px;padding:14px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);font-weight:800}
.pick small{color:var(--muted);font-weight:600;font-size:12px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-bottom:4px}
.cal button{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-variant-numeric:tabular-nums;min-width:0}
.cal button.out{color:var(--muted);opacity:.5}
.cal button.today{background:var(--card2)}
.cal button[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink)}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--pc)}
.time{font-weight:800;font-size:13px;min-width:56px;color:var(--muted);font-variant-numeric:tabular-nums}
.stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--pc,var(--accent))}

/* meals */
.meal{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.meal .d{text-align:center;border-radius:14px;padding:6px 0;background:var(--card2);font-weight:800;line-height:1.1}
.meal .d small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meal.today .d{background:linear-gradient(135deg,var(--glow1),var(--glow2))}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.done-text{text-decoration:line-through;color:var(--muted)}

/* chat */
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.bubble{max-width:100%;padding:10px 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:linear-gradient(135deg,var(--glow1),var(--glow2));color:#2a1a2a;border-bottom-right-radius:6px}
.bubble.them{border-bottom-left-radius:6px}
.mrow{display:flex;gap:8px;align-items:flex-end}
.mrow.me{justify-content:flex-end}
.bubble[data-act]{cursor:pointer}
.mmeta{font-size:11px;color:var(--muted);margin:0 6px}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.composer form{max-width:448px;margin:0 auto;display:flex;gap:8px}
.composer .input{border-radius:999px}

/* play */
.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{border-radius:var(--r-lg);padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;color:#2a1a2a;box-shadow:var(--shadow)}
.game h3{font-size:18px;font-weight:800;font-family:var(--f-display)}
.game .ico{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.6);display:grid;place-items:center}
.g1{background:linear-gradient(150deg,#FFC9A8,#FF9E7A)}
.g2{background:linear-gradient(150deg,#D7C6FA,#B49CF2)}
.g3{background:linear-gradient(150deg,#FFE29A,#FFC56B)}
.g4{background:linear-gradient(150deg,#AEE8DF,#7FD3C9)}
.g5{background:linear-gradient(150deg,#D3E3A8,#A9C27A);grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px}
.game .bar{background:rgba(255,255,255,.55)}

.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto;width:100%}
.ttt button{aspect-ratio:1;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-family:var(--f-display);font-size:44px;font-weight:800}
.ttt .x{color:var(--accent)} .ttt .o{color:var(--c-purple)}
.ttt .win{background:color-mix(in srgb,var(--good) 20%,var(--card))}

.big-q{font-family:var(--f-display);font-size:40px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;padding:8px 0;overflow-wrap:anywhere}
.answer{font-family:var(--f-display);font-size:32px;font-weight:800;text-align:center;min-height:56px;border-radius:var(--r-md);background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{min-height:56px;border-radius:16px;background:var(--card);font-size:22px;font-weight:800;box-shadow:var(--shadow)}
.keypad button.go{background:var(--accent);color:var(--accent-ink)}
.flash-good{animation:fg .4s} .flash-bad{animation:fb .4s}
@keyframes fg{50%{background:color-mix(in srgb,var(--good) 35%,var(--card))}}
@keyframes fb{50%{background:color-mix(in srgb,var(--bad) 35%,var(--card))}}
.timer{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.letters{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.letters span{min-width:34px;height:42px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:lowercase;padding:0 6px}
.letters span.gap{background:var(--card2);color:var(--accent)}

.spin{font-family:var(--f-display);font-size:26px;font-weight:800;text-align:center;padding:18px 10px;border-radius:var(--r-lg);background:linear-gradient(120deg,var(--glow1),var(--glow2),var(--glow3));color:#2a1a2a;min-height:72px;display:grid;place-items:center}
.lb{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pill);color:var(--pill-ink);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;max-width:calc(100% - 32px);text-align:center}
.note{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div id="root" class="app"><p class="muted" style="padding-top:40px;text-align:center">Loading…</p></div>
<div id="sheet-host"></div>

<script>
(() => {
"use strict";
// ---------- family (each family's people come from the server) ----------
const COLORS = ["blue","pink","purple","teal","orange","green","red","gold","slate","brown"];
let FAMILY = null, FAM = [], M = {}, HERO = "";
function setFamily(j){
  FAMILY = j.family; FAM = j.members || []; M = Object.fromEntries(FAM.map(m => [m.id, m])); HERO = FAMILY.hero || "";
  if(j.custom) customPins = j.custom;
  let el = document.getElementById("fam-colors");
  if(!el){ el = document.createElement("style"); el.id = "fam-colors"; document.head.appendChild(el); }
  el.textContent = `:root{${FAM.map(m => `--p-${m.id}:var(--c-${COLORS.includes(m.color) ? m.color : "blue"});`).join("")}}`;
  ls.set("fam-cache", j);
}
const famName = () => FAMILY ? FAMILY.name : "";
const famTitle = () => `The ${famName()} Family`;
const GAME_CAP = 20; // max points per learning game per person per day
const DEFAULT_REWARDS = [
  {id:"d1", title:"30 min extra screen time", cost:50},
  {id:"d2", title:"Pick the movie on movie night", cost:60},
  {id:"d3", title:"Choose what's for dinner", cost:80},
  {id:"d4", title:"$5 pocket money", cost:100},
  {id:"d5", title:"Skip one job", cost:120},
  {id:"d6", title:"Stay up 30 min late", cost:150},
];

// ---------- utils ----------
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayKey = () => ymd(new Date());
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const w = (x.getDay()+6)%7; return addDays(x,-w); };
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

// ---------- store (talks to the family server) ----------
const COLLS = ["events","jobs","ledger","messages","meals","prep","movies","rewards","games","settings"];
const S = Object.fromEntries(COLLS.map(c => [c, []]));
// famToken logs this phone in to the family; token logs in the person using it.
let token = ls.get("evans-token", null), famToken = ls.get("fam-token", null), ver = 0, famVer = 0, syncing = false, syncAgain = false, customPins = [];
function deepMerge(a, b){ const o = {...a}; for(const k in b){ const v = b[k]; o[k] = (v && typeof v==="object" && !Array.isArray(v) && a && typeof a[k]==="object" && a[k] && !Array.isArray(a[k])) ? deepMerge(a[k], v) : v; } return o; }
const clean = o => JSON.parse(JSON.stringify(o));

async function api(path, body){
  const tk = token || famToken;
  const r = await fetch(path, {method: body ? "POST" : "GET", headers: {"Content-Type":"application/json", ...(tk ? {Authorization: "Bearer " + tk} : {})}, body: body ? JSON.stringify(body) : undefined});
  let j = {}; try{ j = await r.json(); }catch{}
  if(r.status===401 && !["/api/family/login", "/api/family/signup"].includes(path)){ if(token) logout(); else leaveFamily(); throw Object.assign(new Error("auth"), {quiet:true}); }
  if(!r.ok) throw Object.assign(new Error(j.error || "Request failed"), {status: r.status, msg: j.error});
  return j;
}
function logout(){ token = null; ls.set("evans-token", null); st.me = null; ls.set("evans-me", null); ver = 0; COLLS.forEach(c => S[c] = []); closeSheet(); clearGame(); render(); }
// Logs this phone out of the family completely, so it needs the family email and password again.
function leaveFamily(){ famToken = null; ls.set("fam-token", null); ls.set("fam-cache", null); FAMILY = null; FAM = []; M = {}; HERO = ""; logout(); }
function applyLocal(op, c, id, data){
  const i = S[c].findIndex(x => x.id===id);
  if(op==="delete"){ if(i>=0) S[c].splice(i,1); }
  else if(op==="update"){ if(i>=0) S[c][i] = deepMerge(S[c][i], data); }
  else { const row = {id, ...data}; if(i<0) S[c].push(row); else S[c][i] = row; }
}
async function write(op, c, id, data){
  applyLocal(op, c, id, data); scheduleRender();
  try{ await api("/api/write", {op, coll:c, id, data}); sync(); return true; }
  catch(e){ if(!e.quiet) toast(e.status===404 ? "That was already removed." : "That didn't save. Check your connection and try again."); ver = 0; sync(); return false; }
}
const store = {
  add(c, data){ return write("set", c, rid(), clean({...data, ts: data.ts || Date.now()})); },
  set(c, id, data){ return write("set", c, id, clean(data)); },
  update(c, id, data){ return write("update", c, id, clean(data)); },
  del(c, id){ return write("delete", c, id); },
};
async function sync(){
  if(!token) return;
  if(syncing){ syncAgain = true; return; }
  syncing = true;
  try{
    const j = await api("/api/sync?v=" + ver);
    if(j.docs){ COLLS.forEach(c => S[c] = []); for(const d of j.docs) if(S[d.coll]) S[d.coll].push({id: d.id, ...d.data}); scheduleRender(); }
    ver = j.v;
    if(j.mv && famVer && j.mv !== famVer) loadFamily();
  }catch(e){ if(!e.quiet) console.warn("sync", e); }
  finally{ syncing = false; if(syncAgain){ syncAgain = false; sync(); } }
}
async function loadFamily(){
  try{ const j = await api("/api/family"); setFamily(j); famVer = j.family.mver; st.famErr = false; scheduleRender(); return true; }
  catch(e){ if(!e.quiet && !FAMILY){ st.famErr = true; scheduleRender(); } return false; }
}
const hasOwnPin = id => customPins.includes(id);
const settings = () => S.settings.find(s => s.id==="family") || {};
async function saveSettings(patch){
  const cur = settings(); const {id, ...rest} = cur;
  return store.set("settings", "family", deepMerge(rest, patch));
}
async function initStore(){
  const cached = ls.get("fam-cache", null);
  if(cached && cached.family && (token || famToken)) setFamily(cached);
  if(token && !famToken){ try{ famToken = (await api("/api/device", {})).device; ls.set("fam-token", famToken); }catch{} }
  if(token || famToken){ await loadFamily(); sync(); }
  render();
  setInterval(() => { if(!document.hidden) sync(); }, 4000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) sync(); });
}

// ---------- points ----------
const balance = id => S.ledger.filter(l => l.who===id).reduce((a,l) => a + (+l.pts||0), 0);
const weekEarned = id => { const from = mondayOf(new Date()).getTime(); return S.ledger.filter(l => l.who===id && l.pts>0 && l.ts>=from).reduce((a,l)=>a+l.pts,0); };
const gameDocId = (id, game, day=todayKey()) => `g_${id}_${game}_${day}`;
const gameToday = (id, game) => { const d = S.ledger.find(l => l.id===gameDocId(id,game)); return d ? d.pts : 0; };
async function awardGame(id, game, earned){
  const docId = gameDocId(id, game); const have = gameToday(id, game);
  const total = Math.min(GAME_CAP, have + earned); const gained = total - have;
  if(gained <= 0) return 0;
  const ok = await store.set("ledger", docId, {who:id, pts:total, kind:"game", game, reason: game==="maths" ? "Maths Sprint" : "Spelling Bee", day: todayKey(), ts: Date.now()});
  return ok ? gained : 0;
}

const isParent = () => !!(me() && me().parent);

let rq = 0;
function scheduleRender(){ if(rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }

function render(){
  const root = $("#root");
  if(st.invite){ root.innerHTML = viewSignup(); return; }
  if(!FAMILY){ root.innerHTML = (token || famToken) ? viewLoading() : viewFamilyLogin(); return; }
  if(!st.me || !M[st.me] || !token){ root.innerHTML = viewWelcome(); bindWelcome(); return; }
  if(st.game) return; // a running learning game owns the screen
  if(st.tab==="chat" && st.thread && $("#composer")){ $("#msgs").innerHTML = msgsHtml(st.thread); markRead(st.thread); return; }
  const views = {home:viewHome, cal:viewCal, jobs:viewJobs, chat:viewChat, play:viewPlay};
  root.innerHTML = (views[st.tab] || viewHome)() + (st.tab==="chat" && st.thread ? "" : navHtml());
  if(st.tab==="chat" && st.thread){ markRead(st.thread); requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight)); }
}

function go(tab, extra={}){ Object.assign(st, {tab, thread:null, play:null}, extra); if(st.rut) st.rut.open = false; render(); window.scrollTo(0,0); }

  return `<div class="stack">

    </div>

// ---------- calendar ----------
const REPEATS = [["", "Never"], ["daily", "Every day"], ["weekdays", "Weekdays"], ["weekly", "Every week"], ["fortnightly", "Every 2 weeks"], ["monthly", "Every month"], ["yearly", "Every year"]];
const repeatLabel = r => (REPEATS.find(x => x[0]===r) || ["",""])[1];
function occursOn(e, k){
  if(!e.repeat) return e.date===k;
  if(!e.date || k < e.date || (e.until && k > e.until) || (e.skip||[]).includes(k)) return false;
  const a = parseYmd(e.date), b = parseYmd(k);
  const diff = Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()) - Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())) / 864e5);
  switch(e.repeat){
    case "daily": return true;
    case "weekdays": return b.getDay()>0 && b.getDay()<6;
    case "weekly": return diff % 7 === 0;
    case "fortnightly": return diff % 14 === 0;
    case "monthly": return b.getDate()===a.getDate();
    case "yearly": return b.getDate()===a.getDate() && b.getMonth()===a.getMonth();
  }
  return false;
}
const eventsOn = k => S.events.filter(e => occursOn(e, k)).sort((a,b) => (a.time||"").localeCompare(b.time||""));
function eventItem(e, k){
  const ppl = (e.who && e.who.length) ? e.who : FAM.map(f=>f.id);
  const color = ppl.length===1 ? ppl[0] : null;
  return `<button class="item" style="text-align:left;${color?pc(color):""}" data-act="edit-event" data-id="${e.id}" data-k="${esc(k||e.date)}">
    <span class="stripe" style="${color?pc(color):""}"></span>
    <span class="time">${esc(niceTime(e.time))}${e.time && e.end ? `<br><span style="font-weight:600">to ${esc(niceTime(e.end))}</span>` : ""}</span>
    <span class="grow"><b>${esc(e.title)}</b>${e.repeat?`<br><span class="small muted">${ic("repeat",`style="width:13px;height:13px;vertical-align:-2px"`)} Repeats ${esc(repeatLabel(e.repeat).toLowerCase())}${e.until?` until ${esc(niceDate(e.until))}`:""}</span>`:""}${e.notes?`<br><span class="small muted">${esc(e.notes)}</span>`:""}</span>
    <span class="faces">${ppl.length===FAM.length ? `<span class="tag" style="--pc:var(--accent)">Everyone</span>` : ppl.map(p=>av(p,"sm")).join("")}</span>
  </button>`;
}

// ---------- chat ----------
const threadOf = m => m.to==="family" ? "family" : [m.from, m.to].sort().join("-");
const threadKey = other => other==="family" ? "family" : [st.me, other].sort().join("-");
const threadMsgs = key => S.messages.filter(m => threadOf(m)===key && (key==="family" || key.split("-").includes(st.me))).sort((a,b)=>a.ts-b.ts);
function lastRead(key){ return ls.get(`evans-read-${st.me}`, {})[key] || 0; }
function markRead(key){ const r = ls.get(`evans-read-${st.me}`, {}); const last = threadMsgs(key).slice(-1)[0]; if(last && (r[key]||0) < last.ts){ r[key] = last.ts; ls.set(`evans-read-${st.me}`, r); } }
function unreadIn(key){ const lr = lastRead(key); return threadMsgs(key).filter(m => m.from!==st.me && m.ts>lr).length; }
function unreadTotal(){ if(!st.me) return 0; return ["family", ...FAM.filter(f=>f.id!==st.me).map(f=>threadKey(f.id))].reduce((a,k)=>a+unreadIn(k),0); }
function viewChat(){
  if(st.thread) return threadView(st.thread);
  const rows = [{key:"family", title:`${famName()} Family`, face:`<span class="faces">${FAM.slice(0,3).map(f=>av(f.id,"sm")).join("")}</span>`},
    ...FAM.filter(f => f.id!==st.me).map(f => ({key: threadKey(f.id), title: f.label, face: av(f.id)}))];
  return `<div class="stack">${header("Messages","Family chat and one-on-ones")}
    <div class="list">${rows.map(r => { const ms = threadMsgs(r.key); const last = ms[ms.length-1]; const u = unreadIn(r.key);
      return `<button class="item" style="text-align:left" data-thread="${r.key}">${r.face}<span class="grow"><b>${esc(r.title)}</b><br><span class="small muted" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${last?`${last.from===st.me?"You":esc(who(last.from))}: ${esc(last.text)}`:"Say hi"}</span></span>${u?`<span class="dot" style="position:static">${u}</span>`:last?`<span class="small muted">${ago(last.ts)}</span>`:""}</button>`; }).join("")}</div>
  </div>`;
}
function msgsHtml(key){
  const ms = threadMsgs(key);
  if(!ms.length) return `<div class="empty">No messages yet. Start the conversation.</div>`;
  return ms.map((m,i) => { const mine = m.from===st.me; const prev = ms[i-1]; const showName = !mine && key==="family" && (!prev || prev.from!==m.from);
    return `<div class="mrow ${mine?"me":""}">${!mine?(showName||key!=="family"?av(m.from,"sm"):'<span style="width:28px;flex:none"></span>'):""}<div style="display:flex;flex-direction:column;${mine?"align-items:flex-end":""};max-width:80%">${showName?`<span class="mmeta">${esc(who(m.from))}</span>`:""}<div class="bubble ${mine?"me":"them"}" ${mine||isParent()?`role="button" tabindex="0" data-act="msg-opts" data-id="${m.id}" aria-label="Message options"`:""}>${esc(m.text)}</div><span class="mmeta">${m.edited?"edited · ":""}${ago(m.ts)}</span></div></div>`; }).join("");
}
function msgOptsSheet(m){
  const mine = m.from===st.me;
  openSheet(`<h2>${mine ? "Your message" : `${esc(who(m.from))}'s message`}</h2>
    <p class="bubble ${mine?"me":"them"}" style="margin-top:12px">${esc(m.text)}</p>
    <div class="stack" style="margin-top:14px">
      ${mine ? `<button class="btn block" data-act="msg-edit" data-id="${m.id}">Edit</button>` : ""}
      <button class="btn ghost block" data-act="msg-del" data-id="${m.id}">${ic("trash")} Delete for everyone</button>
    </div>`, null);
}
function msgEditSheet(m){
  openSheet(`<h2>Edit message</h2><form id="f" class="stack" style="margin-top:12px">
    <textarea class="input" id="me-text" maxlength="1000" required aria-label="Message">${esc(m.text)}</textarea>
    <button class="btn accent block" type="submit">Save</button></form>`, async () => {
      const text = $("#me-text").value.trim(); if(!text) return;
      if(text===m.text){ closeSheet(); return; }
      if(await store.update("messages", m.id, {text, edited: Date.now()})){ closeSheet(); toast("Message edited"); }
    });
}
function threadView(key){
  const title = key==="family" ? `${famName()} Family` : who(key.split("-").find(x => x!==st.me));
  return `<div class="stack">
    <header class="top"><button class="iconbtn" data-act="back-chat" aria-label="Back to messages">${ic("left")}</button><div class="who grow"><b>${esc(title)}</b><span class="muted small">${key==="family"?"Everyone sees these":"Just the two of you"}</span></div></header>
    <div class="msgs" id="msgs">${msgsHtml(key)}</div>
  </div>
  <div class="composer"><form id="composer"><input class="input" id="msg-text" maxlength="1000" placeholder="Message" autocomplete="off" aria-label="Message"><button class="btn accent" type="submit" aria-label="Send">${ic("send")}</button></form></div>`;
}

// ---------- play ----------
function viewPlay(){
  if(st.play==="movie") return movieView();
  if(st.play==="ttt") return tttView();
  const m = me();
  const lvl = learnLevel();
  return `<div class="stack">
    ${header("Play", "Games for the whole family")}
    <div class="game-grid">
      <button class="game g5" data-act="open-snake"><span class="ico">${ic("snake")}</span><span><h3>Snake II Mayhem</h3><span class="small">Bombs, sinkholes and chaos. Built by Brad Evans</span><span class="small num" style="display:block;font-weight:700">${gameToday(m.id,"snake")}/${GAME_CAP} pts today, 1 a level</span></span></button>
      <button class="game g2" data-play="movie"><span class="ico">${ic("film")}</span><span><h3>Movie night</h3><span class="small">Suggest, vote, pick</span></span></button>
      <button class="game g1" data-play="ttt"><span class="ico">${ic("grid")}</span><span><h3>Noughts &amp; crosses</h3><span class="small">Play each other live</span></span></button>
      <button class="game g3" data-act="start-spell"><span class="ico">${ic("abc")}</span><span><h3>Spelling Bee</h3><span class="small num">${gameToday(m.id,"spelling")}/${GAME_CAP} pts today</span><span class="bar" style="display:block;margin-top:6px"><i style="width:${gameToday(m.id,"spelling")/GAME_CAP*100}%"></i></span></span></button>
      <button class="game g4" data-act="start-maths"><span class="ico">${ic("calc")}</span><span><h3>Maths Sprint</h3><span class="small num">${gameToday(m.id,"maths")}/${GAME_CAP} pts today</span><span class="bar" style="display:block;margin-top:6px"><i style="width:${gameToday(m.id,"maths")/GAME_CAP*100}%"></i></span></span></button>
    </div>
    <div class="card stack">
      <div class="row between"><h2>Learning level</h2><span class="tag" style="--pc:var(--accent)">${["","Starter","Middle","Senior"][lvl]}</span></div>
      <div class="seg" role="group" aria-label="Level">${[1,2,3].map(l => `<button data-level="${l}" aria-pressed="${l===lvl}">${["","Starter","Middle","Senior"][l]}</button>`).join("")}</div>
      <p class="small muted">Spelling Bee gives 2 points a word, Maths Sprint 1 point an answer and Snake 1 point a level, up to ${GAME_CAP} points each per day.</p>
    </div>
  </div>`;
}
function learnLevel(){ const m = me(); return ls.get(`evans-level-${m.id}`, m.level || 3); }

function rutIdeas(text){
  const t = " " + text.toLowerCase() + " ";
  // Longer matched phrases are more specific, so a theme scores the total length of what it matched.
  const scored = RUT.map(th => ({th, n: (t.match(new RegExp("\\b(?:" + th.w + ")\\b", "g")) || []).reduce((a, m) => a + m.length, 0)})).filter(x => x.n).sort((a,b) => b.n - a.n);
  const top = scored[0] ? shuffle(scored[0].th.ideas).slice(0, scored[1] ? 3 : 4) : [];
  const second = scored[1] ? shuffle(scored[1].th.ideas.filter(i => !top.includes(i))).slice(0, 1) : [];
  const ideas = [...top, ...second];
  return {ideas: [...ideas, ...shuffle(RUT_ANY).slice(0, Math.max(1, 5 - ideas.length))].slice(0, 5), feelings: scored.some(x => x.th.k==="feelings"), matched: scored.length > 0};

const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const tttGame = () => S.games.find(g => g.id==="ttt");
function tttWinner(b){ for(const l of LINES){ const [a,c,d] = l; if(b[a]!=="." && b[a]===b[c] && b[a]===b[d]) return {mark:b[a], line:l}; } return b.includes(".") ? null : {mark:"draw", line:[]}; }
function tttView(){
  const g = tttGame();

function tttScores(){
  const sc = (tttGame() && tttGame().scores) || {};

}
async function tttMove(i){
  const g = tttGame(); if(!g || !g.x) return;
  const b = g.board.split(""); if(b[i]!=="." || tttWinner(b)) return;
  const turnId = g.turn==="x" ? g.x : g.o;
  if(!g.same && turnId!==st.me){ toast(st.me===g.x||st.me===g.o ? `Waiting for ${who(turnId)}` : "You're watching this one"); return; }
  b[i] = g.turn; const w = tttWinner(b);

  if(w && w.mark!=="draw"){ const wid = w.mark==="x"?g.x:g.o; patch.scores = {[wid]: ((g.scores||{})[wid]||0)+1}; }
  await store.update("games","ttt", patch);
}

// Rank voices so the clearest natural-sounding English voice on the phone wins over the robotic defaults.
function voiceScore(v){

function bestVoice(){

function mathsQ(level){
  const t = level===1 ? pick(["mul","mul","add","sub","div"]) : level===2 ? pick(["mul","neg","pct","sq","frac","order"]) : pick(["lin","pct","sqrt","pow","neg","order","lin"]);
  let q, a;
  switch(t){
    case "mul": { const x = ri(2,12), y = ri(2,12); q = `${x} × ${y}`; a = x*y; break; }
    case "add": { const x = ri(12,99), y = ri(12,99); q = `${x} + ${y}`; a = x+y; break; }
    case "sub": { const x = ri(30,99), y = ri(11,x-1); q = `${x} − ${y}`; a = x-y; break; }
    case "div": { const y = ri(2,12), a0 = ri(2,12); q = `${y*a0} ÷ ${y}`; a = a0; break; }
    case "neg": { const x = ri(-20,20), y = ri(-20,20); const op = pick(["+","−","×"]); q = `${x<0?`(${x})`:x} ${op} ${y<0?`(${y})`:y}`; a = op==="+"?x+y:op==="−"?x-y:x*y; break; }
    case "pct": { const p = pick([10,20,25,50,75,5]); const n = pick([20,40,60,80,120,200,240,400,360]); q = `${p}% of ${n}`; a = p*n/100; if(!Number.isInteger(a)) return mathsQ(level); break; }
    case "sq": { const x = ri(2,15); q = `${x}²`; a = x*x; break; }
    case "frac": { const d = pick([2,3,4,5,8]); const nn = ri(1,d-1); const tot = d*ri(2,12); q = `${nn}/${d} of ${tot}`; a = nn*tot/d; break; }
    case "order": { const x = ri(2,9), y = ri(2,9), z = ri(2,9); q = `${x} + ${y} × ${z}`; a = x + y*z; break; }
    case "sqrt": { const x = ri(4,20); q = `√${x*x}`; a = x; break; }
    case "pow": { const b = pick([2,3,5]); const e = b===2?ri(3,8):b===3?ri(2,4):ri(2,3); q = `${b}^${e}`; a = b**e; break; }
    case "lin": { const x = ri(-9,12), m = ri(2,9), c = ri(-15,20); q = `${m}x ${c<0?"−":"+"} ${Math.abs(c)} = ${m*x+c}`; a = x; break; }
  }
  return {q, a, solve: t==="lin"};
}
function startMaths(){
  st.game = {kind:"maths", level: learnLevel(), score:0, asked:0, ans:"", end: Date.now()+60000, missed:[]};
  st.game.cur = mathsQ(st.game.level);
  $("#root").innerHTML = `<div class="stack">
    <header class="top"><button class="iconbtn" data-act="quit-game" aria-label="Stop playing">${ic("x")}</button><div class="who grow"><b>Maths Sprint</b><span class="muted small">As many as you can in 60 seconds</span></div><span class="timer" id="m-timer">60</span></header>
    <div class="bar"><i id="m-bar" style="width:100%"></i></div>
    <div class="row between"><span class="pill pts num" id="m-score">${ic("star")} 0</span><span class="muted small" id="m-hint"></span></div>
    <div class="big-q" id="m-q"></div>
    <div class="answer" id="m-ans" aria-live="polite"></div>
    <div class="keypad">${["7","8","9","4","5","6","1","2","3","−","0","⌫"].map(k => `<button data-key="${k}" aria-label="${k==="⌫"?"Delete":k==="−"?"Minus":k}">${k}</button>`).join("")}<button class="go" data-key="ok" style="grid-column:1/-1">Enter</button></div>
  </div>`;

function mathsShow(){ const g = st.game; $("#m-q").textContent = g.cur.q + (g.cur.solve ? "" : " ="); $("#m-hint").textContent = g.cur.solve ? "Find x" : ""; $("#m-ans").textContent = g.ans || " "; }
function mathsTick(){
  const g = st.game; if(!g || g.kind!=="maths"){ return; }
  const left = Math.max(0, g.end - Date.now());
  $("#m-timer").textContent = Math.ceil(left/1000); $("#m-bar").style.width = (left/600)+"%";
  if(left<=0){ clearInterval(g.timer); const miss = g.missed.slice(-5);
    finishGame("maths", g.score, 1, miss.length?`<div class="card list"><h3>Ones to practise</h3>${miss.map(m=>`<div class="row between"><span>${esc(m.q)}</span><b class="num">${m.solve?"x = ":""}${m.a}</b></div>`).join("")}</div>`:""); }
}
function mathsKey(k){
  const g = st.game; if(!g || g.kind!=="maths") return;
  if(k==="⌫") g.ans = g.ans.slice(0,-1);
  else if(k==="−"){ g.ans = g.ans.startsWith("-") ? g.ans.slice(1) : "-"+g.ans; }
  else if(k==="ok"){
    if(!g.ans || g.ans==="-") return;
    const ok = parseInt(g.ans,10) === g.cur.a; const el = $("#m-ans");
    el.classList.remove("flash-good","flash-bad"); void el.offsetWidth; el.classList.add(ok?"flash-good":"flash-bad");
    if(ok) g.score++; else g.missed.push(g.cur);
    $("#m-score").innerHTML = `${ic("star")} ${g.score}`;
    g.ans = ""; g.cur = mathsQ(g.level);
  } else if(g.ans.length < 6) g.ans += k;
  mathsShow();
}

// Shrinks a picked photo to a small square so it's quick to load on every phone.
function shrinkPhoto(file){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const n = Math.min(img.naturalWidth, img.naturalHeight), size = 256, c = document.createElement("canvas");
      c.width = c.height = size;
      c.getContext("2d").drawImage(img, (img.naturalWidth - n) / 2, (img.naturalHeight - n) / 2, n, n, 0, 0, size, size);
      URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

function b64ToU8(b){ const s = atob((b + "=".repeat((4 - b.length % 4) % 4)).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(s, c => c.charCodeAt(0)); }

  return sub;
}

    return;
  }
  if(Notification.permission==="denied"){ box.innerHTML = head + `<p class="small">Notifications are blocked for this app. Allow them in your phone's settings for this app, then come back here.</p>`; return; }
  let status = {on: false};
  const sub = await currentSub().catch(() => null);
  if(sub){ try{ status = await api("/api/push/status", {endpoint: sub.endpoint}); }catch{} }
  if(!$("#notif-box")) return;
  if(!status.on){
    box.innerHTML = head + `<p class="small muted">Get a buzz for new messages, reminders 30 minutes before events, and jobs and points.</p><button class="btn accent block" type="button" data-act="notif-on">${ic("bell")} Turn on notifications</button>`;
    return;
  }
  box.innerHTML = head + `<p class="small muted">Tap to choose what this phone tells you about.</p>
    <div class="chips" data-chips="nt-kinds">${NOTIF_KINDS.map(([k,l]) => `<button type="button" class="chip noimg" data-v="${k}" aria-pressed="${!!status.prefs[k]}">${l}</button>`).join("")}</div>
    <div class="row"><button class="btn small grow" type="button" data-act="notif-test">Send a test</button><button class="btn small ghost grow" type="button" data-act="notif-off">Turn off</button></div>`;
}
const notifPrefs = () => Object.fromEntries(NOTIF_KINDS.map(([k]) => [k, chipVals("nt-kinds").includes(k)]));
function openFromUrl(u){
  let q; try{ q = new URL(u, location.href).searchParams; }catch{ return; }
  const tab = q.get("tab"); if(!st.me || !["home","cal","jobs","chat","play"].includes(tab)) return;
  st.tab = tab; st.thread = null; st.play = null;
  const th = q.get("thread"); if(tab==="chat" && th && (th==="family" || th.split("-").includes(st.me))) st.thread = th;
  const day = q.get("day"); if(tab==="cal" && /^\d{4}-\d{2}-\d{2}$/.test(day||"")){ st.calSeg = "cal"; st.calDay = day; const d = parseYmd(day); st.calMonth = new Date(d.getFullYear(), d.getMonth(), 1); }
  if(tab==="jobs") st.jobSeg = q.get("seg")==="rewards" ? "rewards" : "jobs";
  closeSheet(); render(); window.scrollTo(0, st.thread ? document.body.scrollHeight : 0);
}

// ---------- events ----------
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-act],[data-go],[data-pick],[data-day],[data-calseg],[data-jobseg],[data-thread],[data-play],[data-level],[data-cell],[data-key],[data-chips] .chip");
  if(!t) return;
  // chip toggles inside sheets
  const chipWrap = t.closest("[data-chips]");
  if(chipWrap && t.classList.contains("chip")){
    if(chipWrap.dataset.single){ chipWrap.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c===t))); if(chipWrap.dataset.chips==="nt-kinds"){} else if(chipWrap.dataset.chips==="ev-rep"){ const w = $("#ev-until-wrap"); if(w) w.hidden = !t.dataset.v; } }
    else t.setAttribute("aria-pressed", String(t.getAttribute("aria-pressed")!=="true"));
    if(chipWrap.dataset.chips==="nt-kinds") pushOn(notifPrefs()).catch(() => toast("Couldn't save that. Try again."));
    return;
  }
  const d = t.dataset;
  if(d.pick){ st.unlockFor = d.pick; render(); return; }
  if(d.go){ const extra = {}; if(d.seg && d.go==="cal") extra.calSeg = d.seg; if(d.seg && d.go==="jobs") extra.jobSeg = d.seg; go(d.go, extra); if(d.play){ st.play = d.play; render(); } return; }
  if(d.day){ st.calDay = d.day; render(); return; }
  if(d.calseg){ st.calSeg = d.calseg; render(); return; }
  if(d.jobseg){ st.jobSeg = d.jobseg; render(); return; }
  if(d.thread){ st.thread = d.thread; render(); window.scrollTo(0, document.body.scrollHeight); return; }
  if(d.play){ st.play = d.play; render(); window.scrollTo(0,0); return; }
  if(d.level){ ls.set(`evans-level-${st.me}`, +d.level); render(); return; }
  if(d.cell){ tttMove(+d.cell); return; }
  if(d.key){ mathsKey(d.key); return; }
  const id = d.id;
  switch(d.act){
    case "scrim": if(ev.target===t) closeSheet(); break;
    case "cancel-unlock": st.unlockFor = null; render(); break;
    case "unlock": { const member = st.unlockFor, pin = $("#pin").value; t.disabled = true;
      try{ const j = await api("/api/login", {member, pin}); token = j.token; ls.set("evans-token", token); st.me = member; st.unlockFor = null; ls.set("evans-me", member); ver = 0; go("home"); sync(); }
      catch(e){ t.disabled = false; if(e.quiet) break; toast(e.msg || "Couldn't reach the family app. Check your connection."); $("#pin").value = ""; $("#pin").focus(); }
      break; }
    case "profile": profileSheet(); break;
    case "switch": await pushOff(); logout(); loadFamily(); break;
    case "fam-retry": st.famErr = false; render(); if(await loadFamily()) sync(); break;
    case "fam-logout": if(!confirm("Log this phone out of the family? You'll need the family email and password to log back in.")) break; await pushOff(); leaveFamily(); break;
    case "invite-cancel": st.invite = null; history.replaceState(null, "", "/"); render(); break;
    case "family-settings": familySheet(); break;
    case "member-add": memberSheet(null); break;
    case "member-edit": if(M[id]) memberSheet(M[id]); break;
    case "member-remove": { const m = M[id]; if(!m || !confirm(`Remove ${m.label} from the family? They won't be able to log in any more.`)) break;
      try{ await api("/api/members/remove", {id}); await loadFamily(); toast(`${m.label} removed`); familySheet(); }catch(e){ if(!e.quiet) toast(e.msg || "Couldn't remove them. Try again."); } break; }
    case "photo-remove": memberPhoto = ""; $("#mb-av").innerHTML = photoPreview("", $("#mb-name").value); t.hidden = true; break;
    case "invite-new": t.disabled = true; try{ const {code} = await api("/api/invites/create", {}); await loadInvites(); await shareInvite(code); }catch(e){ if(!e.quiet) toast(e.msg || "Couldn't make an invite. Try again."); } t.disabled = false; break;
    case "invite-copy": shareInvite(d.v); break;
    case "notif-on": t.disabled = true; try{ if(await pushOn(Object.fromEntries(NOTIF_KINDS.map(([k]) => [k, true])))){ toast("Notifications on"); api("/api/push/test", {}).catch(() => {}); } }catch(e){ if(!e.quiet) toast("Couldn't turn on notifications. Try again."); } fillNotifBox(); break;
    case "notif-off": await pushOff(); toast("Notifications off on this phone"); fillNotifBox(); break;
    case "notif-test": { const sub = await currentSub().catch(() => null); api("/api/push/test", {endpoint: sub && sub.endpoint}).then(() => toast("Sent. It should pop up in a moment.")).catch(() => toast("Couldn't send a test")); break; }
    case "go-play": closeSheet(); go("play"); break;
    case "quickadd": quickAddSheet(); break;
    case "qa": closeSheet();
      if(d.v==="event") eventSheet(); else if(d.v==="job") jobSheet(); else if(d.v==="meal") mealSheet(todayKey()); else go("chat");
      break;
    case "month": st.calMonth = new Date(st.calMonth.getFullYear(), st.calMonth.getMonth() + (+d.d), 1); render(); break;
    case "week": st.mealWeek = addDays(st.mealWeek, +d.d); render(); break;
    case "add-event": eventSheet(); break;
    case "edit-event": eventSheet(S.events.find(e => e.id===id), d.k); break;
    case "skip-event": { const e = S.events.find(x => x.id===id); if(e && await store.set("events", id, {...e, skip: [...new Set([...(e.skip||[]), d.k])]})){ closeSheet(); toast("Skipped " + niceDate(d.k)); } break; }
    case "del-event": if(await store.del("events", id)){ closeSheet(); toast("Deleted"); } break;
    case "edit-meal": mealSheet(d.k); break;
    case "add-prep": prepSheet(); break;
    case "prep-toggle": { const p = S.prep.find(x => x.id===id); if(p) store.update("prep", id, {done: !p.done}); break; }
    case "prep-del": store.del("prep", id); break;
    case "prep-clear": for(const p of S.prep.filter(p => p.done)) await store.del("prep", p.id); break;
    case "add-job": jobSheet(); break;
    case "job-done": { const j = S.jobs.find(x => x.id===id); if(!j) break; if(isParent()) whoDidSheet(j); else if(await store.update("jobs", id, {status:"pending", doneBy: st.me, doneAt: Date.now()})) toast("Nice! Mum or Dad will check it"); break; }
    case "job-approve": { const j = S.jobs.find(x => x.id===id); if(j) await approveJob(j, j.doneBy); break; }
    case "job-reject": store.update("jobs", id, {status:"open", doneBy:"", doneAt:0}); toast("Sent back to do"); break;
    case "job-del": store.del("jobs", id); break;
    case "bonus": bonusSheet(); break;
    case "redeem": { const r = rewardList().find(x => x.id===id); if(!r || balance(st.me) < r.cost) break;
      if(await store.add("ledger", {who: st.me, pts: -r.cost, kind:"reward", reason: r.title, status:"pending"})) toast(`${r.title} is on the way`); break; }
    case "reward-given": store.update("ledger", id, {status:"given", givenBy: st.me}); break;
    case "add-reward": rewardSheet(); break;
    case "reward-del": if(d.custom==="1") store.del("rewards", id); else saveSettings({["hide_"+id]: true}); break;
    case "back-chat": st.thread = null; render(); break;
    case "back-play": st.play = null; render(); break;
    case "rut-open": st.tab = "home"; st.rut = {...(st.rut||{text:""}), open: true}; render(); window.scrollTo(0,0); break;
    case "rut-back": if(st.rut) st.rut.open = false; render(); window.scrollTo(0,0); break;
    case "msg-opts": { const m = S.messages.find(x => x.id===id); if(m && (m.from===st.me || isParent())) msgOptsSheet(m); break; }
    case "msg-edit": { const m = S.messages.find(x => x.id===id); if(m && m.from===st.me) msgEditSheet(m); break; }
    case "msg-del": { const m = S.messages.find(x => x.id===id); if(m && (m.from===st.me || isParent()) && await store.del("messages", id)){ closeSheet(); toast("Message deleted"); } break; }
    case "rut-ex": rutRun(d.v); break;
    case "rut-ex-more": st.rutEx = shuffle(RUT_EXAMPLES).slice(0, 6); render(); break;
    case "rut-more": if(st.rut) rutRun(st.rut.text); break;
    case "rut-share": if(st.rut && st.rut.text && await store.add("messages", {from: st.me, to: "family", text: `I'm stuck in a rut with: ${st.rut.text}. Any ideas?`})){ toast("Sent to Family chat"); } break;
    case "add-movie": movieSheet(); break;
    case "vote": { const x = S.movies.find(m => m.id===id); if(x) store.update("movies", id, {votes: {[st.me]: !(x.votes && x.votes[st.me])}}); break; }
    case "movie-del": store.del("movies", id); break;
    case "spin": t.disabled = true; await spinMovie(); break;
    case "ttt-new": { const opp = chipVals("ttt-opp")[0]; if(!opp){ toast("Pick who to play"); break; }
      const g = tttGame() || {}; const xFirst = Math.random()<.5;
      await store.set("games","ttt", {x: xFirst?st.me:opp, o: xFirst?opp:st.me, board:".........", turn:"x", same: $("#ttt-same").checked, scores: g.scores||{}, ts: Date.now()}); break; }
    case "ttt-again": { const g = tttGame(); await store.set("games","ttt", {...stripId(g), x: g.o, o: g.x, board:".........", turn:"x", ts: Date.now()}); break; }
    case "ttt-quit": { const g = tttGame() || {}; await store.set("games","ttt", {scores: g.scores||{}, ts: Date.now()}); break; }
    case "start-spell": clearGame(); startSpelling(); break;
    case "start-maths": clearGame(); startMaths(); break;
    case "open-snake": location.href = "/snake.html"; break;
    case "say": say(st.game.words[st.game.i]); break;
    case "say-slow": say(st.game.words[st.game.i], .5); break;
    case "say-sentence": { const g = st.game, w = g.words[g.i], sn = SENTENCES[w]; if(!sn) break;
      const el = $("#spell-sent"); if(el){ el.textContent = blankWord(sn, w); el.hidden = false; }
      if(g.mode==="hear") say(sn, .8); break; }
    case "quit-game": clearGame(); go("play"); break;
  }
});
const stripId = o => { const {id, ...r} = o || {}; return r; };
function clearGame(){ if(st.game && st.game.timer) clearInterval(st.game.timer); try{ speechSynthesis.cancel(); }catch{} st.game = null; }

document.addEventListener("keydown", e => {
  if((e.key==="Enter"||e.key===" ") && e.target.matches(".nav a")){ e.preventDefault(); e.target.click(); }
  if(st.game && st.game.kind==="maths"){ if(/^[0-9]$/.test(e.key)) mathsKey(e.key); else if(e.key==="Backspace") mathsKey("⌫"); else if(e.key==="-") mathsKey("−"); else if(e.key==="Enter") mathsKey("ok"); }
  if(e.key==="Enter" && e.target.id==="pin"){ e.preventDefault(); $('[data-act="unlock"]').click(); }
});

document.addEventListener("change", async e => {
  if(e.target.id==="mb-photo" && e.target.files[0]){
    try{ memberPhoto = await shrinkPhoto(e.target.files[0]); $("#mb-av").innerHTML = photoPreview(memberPhoto); const del = $("#mb-photo-del"); if(del) del.hidden = false; }
    catch{ toast("That photo didn't work. Try a different one."); }
  }
  if(e.target.id==="voice-pick"){ ls.set("evans-voice", e.target.value); if(st.game && st.game.kind==="spelling") say(st.game.words[st.game.i]); }
});
document.addEventListener("submit", e => {
  if(e.target.id==="rut-form"){ e.preventDefault(); e.stopImmediatePropagation(); rutRun($("#rut-in").value); }
}, true);
document.addEventListener("submit", async e => {
  e.preventDefault();
  if(e.target.id==="fam-login"){
    const b = e.target.querySelector("button[type=submit]"); b.disabled = true;
    try{ const j = await api("/api/family/login", {email: $("#fl-email").value, password: $("#fl-pass").value}); famToken = j.device; ls.set("fam-token", famToken); if(!(await loadFamily())) toast("Couldn't load your family. Try again."); render(); }
    catch(err){ b.disabled = false; toast(err.msg || "Couldn't reach Family App. Check your connection."); }
    return;
  }
  if(e.target.id==="signup"){
    const pin = $("#su-pin").value.trim(); if(!/^\d{4}$/.test(pin)){ toast("Your PIN needs to be 4 numbers"); return; }
    const b = e.target.querySelector("button[type=submit]"); b.disabled = true;
    try{
      const j = await api("/api/family/signup", {invite: st.invite.code, family: $("#su-fam").value, email: $("#su-email").value, password: $("#su-pass").value, pin,
        you: {name: $("#su-name").value, label: $("#su-label").value.trim() || $("#su-name").value}});
      await pushOff();
      famToken = j.device; token = j.token; st.me = j.member; ls.set("fam-token", famToken); ls.set("evans-token", token); ls.set("evans-me", j.member);
      st.invite = null; ver = 0; COLLS.forEach(c => S[c] = []); history.replaceState(null, "", "/");
      await loadFamily(); go("home"); sync(); toast("Your family is set up");
    }catch(err){ b.disabled = false; toast(err.msg || "Couldn't reach Family App. Check your connection."); }
    return;
  }
  if(e.target.id==="composer"){
    const inp = $("#msg-text"); const text = inp.value.trim(); if(!text) return;
    const to = st.thread==="family" ? "family" : st.thread.split("-").find(x => x!==st.me) || st.me;
    inp.value = "";
    if(!(await store.add("messages", {from: st.me, to, text}))) inp.value = text;
    window.scrollTo(0, document.body.scrollHeight); inp.focus(); return;
  }
  if(e.target.id==="spell-form"){
    const g = st.game;
    if(g.next){ g.next = false; g.locked = false; g.i++;
      if(g.i >= g.words.length){ const wrong = g.wrong; finishGame("spelling", g.score, 2, wrong.length?`<div class="card list"><h3>Words to practise</h3>${wrong.map(w=>`<b>${esc(w)}</b>`).join("")}</div>`:""); }
      else spellRound();
      return; }
    spellCheck(); return;
  }
  if(sheetSubmit) await sheetSubmit();
});

if(canSpeak()){ loadVoices(); try{ speechSynthesis.onvoiceschanged = loadVoices; }catch{} }
const invite = new URLSearchParams(location.search).get("invite");
if(invite){
  st.invite = {code: invite};
  fetch("/api/invite?code=" + encodeURIComponent(invite)).then(r => r.json().then(j => { st.invite.ok = r.ok; if(!r.ok) st.invite.err = j.error || "That invite link isn't right."; }))
    .catch(() => { st.invite.err = "Couldn't reach Family App. Check your connection and open the link again."; }).finally(render);
}
render();
initStore().then(() => { if(location.search && !invite){ openFromUrl(location.href); history.replaceState(null, "", "/"); } });
})();
</script>
