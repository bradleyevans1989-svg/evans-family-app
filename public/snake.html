<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Chivo+Mono:wght@400;600&display=swap">
<style>
/* Layout: one phone-shell column. LCD screen on top, HUD strip above it, D-pad below, field guide underneath. Single deliberate look (Nokia-era handset), same in both host themes. */
:root {
  --shell: #2b3236;
  --shell-hi: #3a4347;
  --shell-lo: #1c2124;
  --lcd: #b6c592;
  --ink: #1e2913;
  --danger: #9b1d12;
  --amber: #6f4300;
  --label: #c9d2b8;
  --muted: #8a968c;
  --display: "Silkscreen", "Courier New", monospace;
  --body: "Chivo Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
button { font: inherit; }
.back { font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--label); text-decoration: none; background: var(--shell-lo); border: 1px solid #4b565b; border-radius: 6px; padding: 6px 10px; }
.pad button { touch-action: manipulation; }
html { background: var(--shell-lo); min-height: 100%; }
body { min-height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--shell-hi), var(--shell) 55%, var(--shell-lo));
  background-color: var(--shell);
  color: var(--label);
  font-family: var(--body);
  font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
.wrap { max-width: 560px; margin: 0 auto; padding-block: 14px 32px; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
header h1 { flex: 1; min-width: 0; white-space: nowrap; }
@media (max-width: 480px) { h1 { font-size: 17px; } h1 small { display: none; } }
@media (hover: none), (pointer: coarse) { #btnPause { display: none; } }
h1 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .04em; margin: 0; color: var(--lcd); text-wrap: balance; }
h1 small { font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: .12em; margin-left: 6px; }
.iconbtns { display: flex; gap: 8px; }
.iconbtns button, .ovl button {
  font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  background: var(--shell-lo); color: var(--label); border: 1px solid #4b565b; border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
.iconbtns button:focus-visible, .ovl button:focus-visible, .pad button:focus-visible { outline: 2px solid var(--lcd); outline-offset: 2px; }

.screen {
  position: relative; align-self: center; box-sizing: border-box;
  background: var(--shell-lo); border-radius: 14px; padding: 10px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.06);
  max-width: 100%;
}
.hud {
  display: flex; justify-content: space-between; gap: 8px; align-items: center;
  background: var(--lcd); color: var(--ink); font-family: var(--display); font-size: 13px;
  padding: 5px 8px 3px; border-radius: 4px 4px 0 0; font-variant-numeric: tabular-nums;
  box-sizing: border-box; white-space: nowrap; overflow: hidden;
}
.hud .fx { display: flex; gap: 6px; font-size: 11px; color: var(--amber); min-height: 1em; }
.hud .fx .bad { color: var(--danger); }
canvas#game { display: block; background: var(--lcd); border-radius: 0 0 4px 4px; touch-action: none; max-width: 100%; }

.ovl {
  position: absolute; inset: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: rgba(182,197,146,.93); color: var(--ink); border-radius: 4px; text-align: center; padding: 16px;
}
.ovl h2 { font-family: var(--display); font-size: 30px; line-height: 1; margin: 0; letter-spacing: .03em; text-wrap: balance; }
.ovl p { margin: 0; font-size: 13px; max-width: 34ch; line-height: 1.45; }
.ovl .big { font-family: var(--display); font-size: 18px; }
.ovl .credit { font-family: var(--display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; margin-top: 4px; }
.ovl button { background: var(--ink); color: var(--lcd); border-color: var(--ink); font-size: 15px; padding: 10px 22px; }

.pad { display: none; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 56px); gap: 6px; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; }
.pad button {
  background: linear-gradient(var(--shell-hi), var(--shell-lo)); border: 1px solid #4b565b; border-radius: 12px; color: var(--label);
  font-family: var(--display); font-size: 20px; touch-action: none;
}
.pad button:active, .pad button.on { background: var(--lcd); color: var(--ink); }
.pad .u { grid-column: 2; grid-row: 1; } .pad .l { grid-column: 1; grid-row: 2; }
.pad .r { grid-column: 3; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 3; }
.pad .p { grid-column: 2; grid-row: 2; font-size: 11px; }
@media (hover: none), (pointer: coarse) { .pad { display: grid; } .keys { display: none; } }

.keys { text-align: center; color: var(--muted); font-size: 12px; }
.keys kbd { font-family: var(--display); background: var(--shell-lo); border: 1px solid #4b565b; border-radius: 4px; padding: 1px 5px; color: var(--label); }

.guide h3 { font-family: var(--display); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 8px 0 8px; font-weight: 400; }
.guide ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 16px; }
.guide li { display: flex; gap: 10px; align-items: center; min-width: 0; line-height: 1.35; font-size: 12.5px; }
.guide li b { color: var(--lcd); font-weight: 600; }
.guide canvas { flex: none; width: 30px; height: 30px; border-radius: 3px; image-rendering: pixelated; }
@media (prefers-reduced-motion: reduce) { .ovl { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/?tab=play" id="btnBack">&larr; Back</a>
    <h1>SNAKE II <small>MAYHEM</small></h1>
    <div class="iconbtns">
      <button id="btnSound" type="button" aria-pressed="true">Sound on</button>
      <button id="btnPause" type="button">Pause</button>
    </div>
  </header>

  <div class="screen" id="screen">
    <div class="hud">
      <span id="hudScore">0000</span>
      <span class="fx" id="hudFx"></span>
      <span id="hudLives">♥♥♥ L1</span>
    </div>
    <canvas id="game" width="480" height="480" aria-label="Game board"></canvas>
    <div class="ovl" id="ovl">
      <h2>SNAKE II<br>MAYHEM</h2>
      <p>Nokia snake, but everything is on fire. Eat fast to chain combos, kick bombs before they blow, and don't fall in the holes.</p>
      <button id="btnStart" type="button">Play</button>
      <p class="big" id="ovlBest"></p>
      <p class="credit">Built by Brad Evans</p>
    </div>
  </div>

  <div class="pad" id="pad" aria-label="Direction pad">
    <button class="u" data-d="up" type="button" aria-label="Up">▲</button>
    <button class="l" data-d="left" type="button" aria-label="Left">◀</button>
    <button class="p" data-d="pause" type="button" aria-label="Pause">II</button>
    <button class="r" data-d="right" type="button" aria-label="Right">▶</button>
    <button class="d" data-d="down" type="button" aria-label="Down">▼</button>
  </div>
  <p class="keys"><kbd>←↑↓→</kbd> or <kbd>WASD</kbd> to steer · <kbd>Space</kbd> pause · <kbd>M</kbd> mute. You can also swipe on the screen.</p>

  <section class="guide">
    <h3>Field guide</h3>
    <ul id="guide"></ul>
  </section>
</div>

<script>
(() => {
'use strict';
const COLS = 24, ROWS = 24;
const C = { lcd: '#b6c592', ink: '#1e2913', off: 'rgba(30,41,19,0.07)', danger: '#9b1d12', amber: '#6f4300' };

// ---------- sprites (5x5) ----------
const SP = {
  food:   ['..#..', '.#.#.', '#...#', '.#.#.', '..#..'],
  bomb:   ['...#.', '..#..', '.###.', '#####', '.###.'],
  bomb2:  ['.#...', '..#..', '.###.', '#####', '.###.'],
  pitW:   ['#.#.#', '.....', '#...#', '.....', '#.#.#'],
  pit:    ['#####', '#...#', '#.#.#', '#...#', '#####'],
  portA:  ['.###.', '#...#', '#.#.#', '#...#', '.###.'],
  portB:  ['.###.', '##.##', '#...#', '##.##', '.###.'],
  ghost:  ['.###.', '#.#.#', '#####', '#####', '#.#.#'],
  slow:   ['#####', '.#.#.', '..#..', '.###.', '#####'],
  shield: ['.#.#.', '#####', '#####', '.###.', '..#..'],
  scissors:['#...#', '.#.#.', '..#..', '##.##', '##.##'],
  frenzy: ['#.#.#', '.###.', '##.##', '.###.', '#.#.#'],
  defuse: ['....#', '...#.', '#.#..', '.#...', '.....'],
  bug1:   ['#...#', '.###.', '#####', '.###.', '#...#'],
  bug2:   ['.#.#.', '.###.', '#####', '.###.', '.#.#.'],
};
const POWERS = {
  ghost:    { label: 'GHOST', ms: 6000, desc: 'Phase through walls, holes and your own tail.' },
  slow:     { label: 'SLOW',  ms: 6000, desc: 'Slows the clock so you can thread the needle.' },
  shield:   { label: 'SHIELD', desc: 'Soaks up one death. Stack up to two.' },
  scissors: { label: 'SNIP', desc: 'Cuts your tail in half and pays out for every segment.' },
  frenzy:   { label: 'FRENZY', desc: 'Dumps a pile of bonus food on the board for 8 seconds.' },
  defuse:   { label: 'DEFUSE', desc: 'Every bomb on the board fizzles for points.' },
};
const POWER_TYPES = Object.keys(POWERS);

// ---------- mazes: edges always wrap, walls leave tunnels ----------
const inR = (v, a, b) => v >= a && v <= b;
const MAZES = [
  { name: 'OPEN FIELD', wall: () => false },
  { name: 'THE BOX', wall: (x, y) => (x === 0 || x === COLS - 1 || y === 0 || y === ROWS - 1) && !(inR(x, 10, 13) || inR(y, 10, 13)) },
  { name: 'BRACKETS', wall: (x, y) => {
      const L = (cx, cy, sx, sy) => (y === cy && inR((x - cx) * sx, 0, 5)) || (x === cx && inR((y - cy) * sy, 0, 5));
      return L(3, 3, 1, 1) || L(20, 3, -1, 1) || L(3, 20, 1, -1) || L(20, 20, -1, -1) ||
        ((x === 11 || x === 12) && inR(y, 9, 14)) || ((y === 11 || y === 12) && inR(x, 9, 14));
    } },
  { name: 'RAILS', wall: (x, y) => ((y === 6 || y === 17) && !inR(x, 9, 14)) || ((x === 6 || x === 17) && inR(y, 9, 14)) },
  { name: 'THE CAGE', wall: (x, y) => {
      const edge = (x === 0 || x === COLS - 1 || y === 0 || y === ROWS - 1) && !(inR(x, 3, 5) || inR(x, 18, 20) || inR(y, 3, 5) || inR(y, 18, 20));
      const ring = (inR(x, 7, 16) && (y === 7 || y === 16) || inR(y, 7, 16) && (x === 7 || x === 16)) && !(inR(x, 11, 12) || inR(y, 11, 12));
      return edge || ring;
    } },
  { name: 'ZIGZAG', wall: (x, y) => (y % 6 === 3) && ((Math.floor(y / 6) % 2 === 0) ? x < 17 : x > 6) },
];

// ---------- helpers ----------
const wrap = (v, n) => (v % n + n) % n;
const key = (x, y) => y * COLS + x;
const dist = (a, b) => { const dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y); return Math.min(dx, COLS - dx) + Math.min(dy, ROWS - dy); };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// ---------- sound ----------
let actx = null, soundOn = store.get('sm-sound') !== 'off';
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { actx = null; } } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
function beep(freq, dur = 0.05, type = 'square', vol = 0.05, slide = 0, delay = 0) {
  if (!soundOn) return; const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function boom() {
  if (!soundOn) return; const a = audio(); if (!a) return;
  const len = Math.floor(a.sampleRate * 0.35), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = 0.25; s.buffer = buf; s.connect(f).connect(g).connect(a.destination); s.start();
  beep(90, 0.3, 'square', 0.08, -50);
}
const SFX = {
  eat: c => beep(660 + Math.min(c, 8) * 70, 0.05),
  power: () => { beep(523, 0.06); beep(784, 0.06, 'square', 0.05, 0, 0.06); beep(1046, 0.08, 'square', 0.05, 0, 0.12); },
  portal: () => beep(300, 0.18, 'sawtooth', 0.04, 900),
  die: () => { beep(440, 0.12); beep(330, 0.12, 'square', 0.05, 0, 0.12); beep(220, 0.3, 'square', 0.05, -100, 0.24); },
  defuse: () => beep(1200, 0.12, 'triangle', 0.06, -800),
  alarm: () => { beep(980, 0.08); beep(980, 0.08, 'square', 0.05, 0, 0.14); },
  level: () => [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.08, 'square', 0.05, 0, i * 0.08)),
  tick: () => beep(1500, 0.015, 'square', 0.025),
};

// ---------- family points: 1 point per level cleared, same daily cap and ledger shape as the other games ----------
const FAMILY_CAP = 20;
const family = (() => {
  let token = null, me = null;
  try { token = JSON.parse(localStorage.getItem('evans-token')); me = JSON.parse(localStorage.getItem('evans-me')); } catch {}
  const p2 = n => String(n).padStart(2, '0');
  const day = () => { const d = new Date(); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; };
  const docId = () => `g_${me}_snake_${day()}`;
  let today = 0, loadedFor = null, earnedThisGame = 0, queue = Promise.resolve();
  const api = (path, body) => fetch(path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: body ? JSON.stringify(body) : undefined })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  async function load() {
    if (loadedFor === day()) return;
    const j = await api('/api/sync?v=0');
    const d = (j.docs || []).find(x => x.coll === 'ledger' && x.id === docId());
    today = d ? (+d.data.pts || 0) : 0; loadedFor = day();
  }
  return {
    on: !!(token && me),
    get today() { return today; },
    get earned() { return earnedThisGame; },
    reset() { earnedThisGame = 0; if (this.on) queue = queue.then(load).catch(() => {}); },
    // resolves to points actually added (0 at the cap or when offline)
    award(n) {
      if (!this.on) return Promise.resolve(0);
      const run = queue.then(async () => {
        await load();
        const total = Math.min(FAMILY_CAP, today + n), gained = total - today;
        if (gained <= 0) return 0;
        await api('/api/write', { op: 'set', coll: 'ledger', id: docId(), data: { who: me, pts: total, kind: 'game', game: 'snake', reason: 'Snake II Mayhem', day: day(), ts: Date.now() } });
        today = total; earnedThisGame += gained; return gained;
      }).catch(() => 0);
      queue = run; return run;
    },
  };
})();

// ---------- state ----------
let S = null;
let best = parseInt(store.get('sm-best') || '0', 10) || 0;
let mode = 'title'; // title | play | pause | over

function newGame() {
  S = {
    score: 0, lives: 3, level: 1, eaten: 0, eatenLevel: 0,
    snake: [], dir: [1, 0], queue: [], grow: 0,
    walls: new Set(), food: [], bombs: [], pits: [], portal: null, powers: [], critter: null,
    blasts: [], pops: [],
    fx: { ghost: 0, slow: 0, mirror: 0, surge: 0, invuln: 0 }, shield: 0,
    combo: 1, lastEat: -1e9, t: 0, acc: 0,
    next: { power: 7000, bomb: 4500, pit: 9000, portal: 2500, chaos: 20000 },
    banner: null, shake: 0, flash: 0, dyingUntil: 0,
  };
  buildLevel(true);
  spawnSnake();
  ensureFood();
}

function buildLevel(initial, shift) {
  const m = MAZES[(S.level - 1) % MAZES.length];
  const ox = shift ? Math.floor(rnd(-3, 4)) : 0, oy = shift ? Math.floor(rnd(-3, 4)) : 0;
  const head = S.snake[0];
  const body = new Set(S.snake.map(s => key(s.x, s.y)));
  S.walls = new Set();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!m.wall(wrap(x - ox, COLS), wrap(y - oy, ROWS))) continue;
    if (body.has(key(x, y))) continue;
    if (head && dist(head, { x, y }) <= 3) continue;
    S.walls.add(key(x, y));
  }
  // anything that ended up inside a wall goes away
  const free = o => !S.walls.has(key(o.x, o.y));
  S.food = S.food.filter(free); S.bombs = S.bombs.filter(free); S.pits = S.pits.filter(free); S.powers = S.powers.filter(free);
  if (S.portal && (!free(S.portal.a) || !free(S.portal.b))) S.portal = null;
  if (S.critter && !free(S.critter)) S.critter = null;
  if (!initial) ensureFood();
}

function spawnSnake() {
  const rows = [12, 11, 13, 10, 14, 9, 15, 8, 16, 4, 20, 2];
  let row = 12, sx = 4;
  outer: for (const y of rows) for (const x0 of [4, 2, 8, 12]) {
    let ok = true; for (let x = x0; x < x0 + 10; x++) if (S.walls.has(key(wrap(x, COLS), y))) { ok = false; break; }
    if (ok) { row = y; sx = x0; break outer; }
  }
  S.snake = []; for (let i = 0; i < 4; i++) S.snake.push({ x: sx + 3 - i, y: row });
  S.dir = [1, 0]; S.queue = []; S.grow = 0;
  const h = S.snake[0];
  S.bombs = S.bombs.filter(b => dist(b, h) > 5);
  S.pits = S.pits.filter(p => dist(p, h) > 5 && !(p.y === row));
}

function occupied(x, y) {
  const k = key(x, y);
  if (S.walls.has(k)) return true;
  for (const s of S.snake) if (s.x === x && s.y === y) return true;
  for (const arr of [S.food, S.bombs, S.pits, S.powers]) for (const o of arr) if (o.x === x && o.y === y) return true;
  if (S.portal && ((S.portal.a.x === x && S.portal.a.y === y) || (S.portal.b.x === x && S.portal.b.y === y))) return true;
  if (S.critter && S.critter.x === x && S.critter.y === y) return true;
  return false;
}
function freeCell(minHead = 0) {
  const h = S.snake[0];
  for (let i = 0; i < 400; i++) {
    const x = Math.floor(Math.random() * COLS), y = Math.floor(Math.random() * ROWS);
    if (occupied(x, y)) continue;
    if (h && dist(h, { x, y }) < minHead) continue;
    // keep the square directly ahead of the head clear
    if (h && x === wrap(h.x + S.dir[0], COLS) && y === wrap(h.y + S.dir[1], ROWS)) continue;
    return { x, y };
  }
  return null;
}
function ensureFood() {
  if (!S.food.some(f => !f.until)) { const c = freeCell(2); if (c) S.food.push(c); }
}

// ---------- input ----------
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
const DV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function turn(name) {
  if (mode === 'title' || mode === 'over') return;
  if (mode === 'pause') { setMode('play'); }
  if (S.fx.mirror > 0) name = OPP[name];
  const d = DV[name];
  const last = S.queue.length ? S.queue[S.queue.length - 1] : S.dir;
  if (d[0] === -last[0] && d[1] === -last[1]) return; // no 180s
  if (d[0] === last[0] && d[1] === last[1]) return;
  if (S.queue.length < 3) S.queue.push(d);
}

// ---------- events ----------
function banner(text, sub, ms = 1600, bad = false) { S.banner = { text, sub, until: S.t + ms, bad }; }
function pop(x, y, text, bad = false) { S.pops.push({ x, y, text, t0: S.t, bad }); }

function addScore(n, x, y, label) {
  S.score += n;
  if (x != null) pop(x, y, label || ('+' + n));
}

function cutSnake(index) {
  // keep segments [0, index)
  const lost = S.snake.length - index;
  if (lost <= 0) return;
  S.snake.length = Math.max(1, index);
  S.grow = 0;
  const h = S.snake[0];
  pop(h.x, h.y, '-' + lost, true);
}

function hurt(reason) {
  if (S.fx.invuln > 0 || S.fx.ghost > 0) return false;
  if (S.shield > 0) {
    S.shield--; S.fx.invuln = 1400; S.flash = 120; S.shake = 8;
    banner('SHIELD!', 'saved from ' + reason.toLowerCase(), 1000); SFX.defuse();
    return false;
  }
  die(reason); return true;
}

function die(reason) {
  S.lives--; S.shake = 18; S.flash = 200; SFX.die();
  S.dyingUntil = S.t + 1300;
  S.combo = 1;
  banner(S.lives > 0 ? reason : 'GAME OVER', S.lives > 0 ? (S.lives + (S.lives === 1 ? ' life left' : ' lives left')) : 'score ' + S.score, 1300, true);
}

function explode(b) {
  const cells = [];
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    if (Math.abs(dx) + Math.abs(dy) > 2) continue;
    cells.push({ x: wrap(b.x + dx, COLS), y: wrap(b.y + dy, ROWS) });
  }
  const set = new Set(cells.map(c => key(c.x, c.y)));
  S.blasts.push({ cells, t0: S.t });
  S.shake = Math.max(S.shake, 12); S.flash = Math.max(S.flash, 60); boom();
  for (const k of set) S.walls.delete(k);
  S.food = S.food.filter(f => !set.has(key(f.x, f.y)));
  S.powers = S.powers.filter(p => !set.has(key(p.x, p.y)));
  if (S.critter && set.has(key(S.critter.x, S.critter.y))) { addScore(25, S.critter.x, S.critter.y, 'ROAST +25'); S.critter = null; }
  for (const o of S.bombs) if (o !== b && set.has(key(o.x, o.y))) o.at = Math.min(o.at, S.t + 140);
  if (S.dyingUntil <= S.t) {
    const idx = S.snake.findIndex(s => set.has(key(s.x, s.y)));
    if (idx === 0) hurt('BLOWN UP');
    else if (idx > 0 && S.fx.ghost <= 0 && S.fx.invuln <= 0) cutSnake(idx);
  }
  ensureFood();
}

const CHAOS = [
  { name: 'BOMB RAIN', run() { const n = 3 + Math.min(S.level, 5); for (let i = 0; i < n; i++) { const c = freeCell(4); if (c) S.bombs.push({ ...c, born: S.t, at: S.t + 2600 + i * 350 }); } } },
  { name: 'MIRROR', sub: 'controls flipped', run() { S.fx.mirror = 6000; } },
  { name: 'SURGE', sub: 'speed x2', run() { S.fx.surge = 5000; } },
  { name: 'QUAKE', sub: 'the walls moved', run() { buildLevel(false, true); } },
  { name: 'SINKHOLES', run() { for (let i = 0; i < 3 + Math.min(S.level, 4); i++) spawnPit(4); } },
];
function spawnPit(minHead = 5) { const c = freeCell(minHead); if (c) S.pits.push({ ...c, t0: S.t, warn: 1500, open: rnd(6000, 10000), opened: false }); }

// ---------- simulation ----------
function tickMs() {
  let ms = Math.max(55, 135 - (S.level - 1) * 9 - S.eatenLevel * 1.5);
  if (S.fx.slow > 0) ms *= 1.8;
  if (S.fx.surge > 0) ms *= 0.55;
  return ms;
}

function step() {
  if (S.queue.length) S.dir = S.queue.shift();
  const h = S.snake[0];
  let nx = wrap(h.x + S.dir[0], COLS), ny = wrap(h.y + S.dir[1], ROWS);
  if (S.portal) {
    const { a, b } = S.portal;
    let out = null;
    if (nx === a.x && ny === a.y) out = b; else if (nx === b.x && ny === b.y) out = a;
    if (out) { nx = wrap(out.x + S.dir[0], COLS); ny = wrap(out.y + S.dir[1], ROWS); SFX.portal(); S.portal.used = S.t; }
  }
  const phase = S.fx.ghost > 0 || S.fx.invuln > 0;
  if (!phase) {
    if (S.walls.has(key(nx, ny))) { if (hurt('HIT A WALL')) return; }
    const pit = S.pits.find(p => p.opened && p.x === nx && p.y === ny);
    if (pit) { if (hurt('FELL IN A HOLE')) return; }
    const tailMoves = S.grow === 0;
    const end = tailMoves ? S.snake.length - 1 : S.snake.length;
    for (let i = 1; i < end; i++) if (S.snake[i].x === nx && S.snake[i].y === ny) { if (hurt('BIT YOURSELF')) return; break; }
  }
  S.snake.unshift({ x: nx, y: ny });
  if (S.grow > 0) S.grow--; else S.snake.pop();

  // food
  const fi = S.food.findIndex(f => f.x === nx && f.y === ny);
  if (fi >= 0) {
    const f = S.food[fi]; S.food.splice(fi, 1);
    S.combo = (S.t - S.lastEat < 2600) ? Math.min(S.combo + 1, 9) : 1;
    S.lastEat = S.t;
    const pts = (f.until ? 3 : 5) * S.level * S.combo;
    addScore(pts, nx, ny, S.combo > 1 ? 'x' + S.combo + ' +' + pts : '+' + pts);
    S.grow += 1; SFX.eat(S.combo);
    if (!f.until) {
      S.eaten++; S.eatenLevel++;
      if (S.eaten % 5 === 0 && !S.critter) spawnCritter();
      if (S.eatenLevel >= 8) levelUp();
    }
    ensureFood();
  }
  // bomb: running over a lit bomb kicks the fuse out
  const bi = S.bombs.findIndex(b => b.x === nx && b.y === ny);
  if (bi >= 0) { S.bombs.splice(bi, 1); addScore(15 * S.level, nx, ny, 'DEFUSED +' + 15 * S.level); S.grow += 2; SFX.defuse(); }
  // power-up
  const pi = S.powers.findIndex(p => p.x === nx && p.y === ny);
  if (pi >= 0) { const p = S.powers[pi]; S.powers.splice(pi, 1); applyPower(p.type, nx, ny); }
  // critter
  if (S.critter && S.critter.x === nx && S.critter.y === ny) {
    const pts = 20 + Math.ceil((S.critter.until - S.t) / 1000) * 10 * S.level;
    addScore(pts, nx, ny, 'BUG +' + pts); S.critter = null; S.grow += 2; SFX.power();
  }
}

function applyPower(type, x, y) {
  SFX.power(); pop(x, y, POWERS[type].label);
  switch (type) {
    case 'ghost': S.fx.ghost = POWERS.ghost.ms; break;
    case 'slow': S.fx.slow = POWERS.slow.ms; break;
    case 'shield': S.shield = Math.min(2, S.shield + 1); break;
    case 'scissors': {
      const keep = Math.max(3, Math.ceil(S.snake.length / 2)), lost = S.snake.length - keep;
      if (lost > 0) { S.snake.length = keep; S.grow = 0; addScore(lost * 4 * S.level); }
      break;
    }
    case 'frenzy': for (let i = 0; i < 7; i++) { const c = freeCell(2); if (c) S.food.push({ ...c, until: S.t + 8000 }); } break;
    case 'defuse': {
      let n = 0; for (const b of S.bombs) { pop(b.x, b.y, 'FIZZ'); n++; }
      S.bombs = []; addScore(n * 10 * S.level); break;
    }
  }
  banner(POWERS[type].label, null, 800);
}

function spawnCritter() { const c = freeCell(5); if (c) { S.critter = { ...c, until: S.t + 7000, moveAt: S.t + 500 }; banner('BUG!', 'catch it', 900); } }

function levelUp() {
  S.level++; S.eatenLevel = 0;
  const m = MAZES[(S.level - 1) % MAZES.length];
  buildLevel(false);
  banner('LEVEL ' + S.level, m.name, 1800); SFX.level();
  addScore(50 * S.level);
  const h = S.snake[0], game = S;
  family.award(1).then(n => { if (n && S === game) pop(h.x, h.y + 2, '+1 FAMILY PT'); });
}

function update(dt) {
  S.t += dt;
  for (const k in S.fx) if (S.fx[k] > 0) S.fx[k] = Math.max(0, S.fx[k] - dt);
  S.shake = Math.max(0, S.shake - dt * 0.05);
  S.flash = Math.max(0, S.flash - dt);
  S.pops = S.pops.filter(p => S.t - p.t0 < 900);
  S.blasts = S.blasts.filter(b => S.t - b.t0 < 450);

  if (S.dyingUntil) {
    if (S.t < S.dyingUntil) return;
    S.dyingUntil = 0;
    if (S.lives <= 0) { gameOver(); return; }
    S.fx = { ghost: 0, slow: 0, mirror: 0, surge: 0, invuln: 1500 };
    spawnSnake(); ensureFood(); S.acc = 0;
  }

  // spawners
  const N = S.next, L = S.level;
  if (S.t >= N.bomb) {
    if (S.bombs.length < 2 + L) { const c = freeCell(5); if (c) S.bombs.push({ ...c, born: S.t, at: S.t + rnd(3800, 5200) }); }
    N.bomb = S.t + Math.max(1600, rnd(5500, 8000) - L * 550);
  }
  if (S.t >= N.pit) { if (S.pits.length < 2 + L) spawnPit(); N.pit = S.t + Math.max(2600, rnd(9000, 12000) - L * 800); }
  if (S.t >= N.power) {
    if (S.powers.length < 2) { const c = freeCell(3); if (c) S.powers.push({ ...c, type: pick(POWER_TYPES), until: S.t + 8000 }); }
    N.power = S.t + rnd(6000, 10000);
  }
  if (S.t >= N.portal) {
    const a = freeCell(3), b = a && freeCell(3);
    if (a && b && dist(a, b) > 8) S.portal = { a, b, until: S.t + rnd(12000, 18000) };
    N.portal = S.t + rnd(14000, 20000);
  }
  if (S.portal && S.t > S.portal.until && !(S.portal.used && S.t - S.portal.used < 400)) S.portal = null;
  if (S.t >= N.chaos) {
    const c = pick(CHAOS); c.run(); banner(c.name, c.sub, 1600, true); SFX.alarm(); S.flash = 90;
    N.chaos = S.t + Math.max(10000, rnd(20000, 28000) - L * 1500);
  }

  // timers on board
  for (const b of S.bombs.slice()) {
    const left = b.at - S.t;
    if (left <= 0) { S.bombs.splice(S.bombs.indexOf(b), 1); explode(b); if (S.dyingUntil) return; continue; }
    const sec = Math.ceil(left / 1000);
    if (sec !== b.lastSec) { b.lastSec = sec; if (sec <= 2) SFX.tick(); }
  }
  for (const p of S.pits.slice()) {
    const age = S.t - p.t0;
    if (!p.opened && age >= p.warn) {
      p.opened = true;
      const idx = S.snake.findIndex(s => s.x === p.x && s.y === p.y);
      if (idx === 0) { if (hurt('THE GROUND OPENED')) return; }
      else if (idx > 0 && S.fx.ghost <= 0 && S.fx.invuln <= 0) cutSnake(idx);
    }
    if (age >= p.warn + p.open) S.pits.splice(S.pits.indexOf(p), 1);
  }
  S.powers = S.powers.filter(p => p.until > S.t);
  S.food = S.food.filter(f => !f.until || f.until > S.t);
  if (S.critter) {
    if (S.t > S.critter.until) S.critter = null;
    else if (S.t >= S.critter.moveAt) {
      S.critter.moveAt = S.t + 450;
      const d = pick(Object.values(DV)), nx = wrap(S.critter.x + d[0], COLS), ny = wrap(S.critter.y + d[1], ROWS);
      const save = S.critter; S.critter = null;
      if (!occupied(nx, ny)) { save.x = nx; save.y = ny; }
      S.critter = save;
    }
  }
  ensureFood();

  // movement
  S.acc += dt;
  let guard = 0;
  while (S.acc >= tickMs() && guard++ < 4) {
    S.acc -= tickMs();
    step();
    if (S.dyingUntil) { S.acc = 0; break; }
  }
  if (S.score > best) { best = S.score; }
}

function gameOver() {
  store.set('sm-best', String(best));
  setMode('over');
}

// ---------- rendering ----------
const cv = document.getElementById('game'), g = cv.getContext('2d');
let cell = 20, dpr = 1;

function resize() {
  const screen = document.getElementById('screen');
  const wrapW = screen.parentElement.clientWidth - 20;
  // fit the board between whatever sits above it and the D-pad below, so nothing needs scrolling while you play
  const pad = document.getElementById('pad');
  const padH = getComputedStyle(pad).display === 'none' ? 0 : pad.offsetHeight + 12;
  const above = screen.getBoundingClientRect().top + window.scrollY;
  const hudH = document.querySelector('.hud').offsetHeight;
  const probe = document.createElement('div'); probe.style.cssText = 'position:fixed;visibility:hidden;height:env(safe-area-inset-bottom,0px)';
  document.body.append(probe); const safeB = probe.offsetHeight; probe.remove();
  const availH = window.innerHeight - above - 20 - hudH - padH - safeB - 12;
  const size = Math.max(240, Math.min(wrapW, availH, 600));
  cell = Math.floor(size / COLS);
  const px = cell * COLS;
  dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.style.width = px + 'px'; cv.style.height = px + 'px';
  cv.width = px * dpr; cv.height = px * dpr;
  document.querySelector('.hud').style.width = px + 'px';
  screen.style.width = (px + 20) + 'px';
  draw();
}

function sprite(ctx, bm, x, y, c, color, alpha = 1) {
  const p = c / 6, o = p / 2;
  ctx.fillStyle = color; ctx.globalAlpha = alpha;
  for (let r = 0; r < 5; r++) for (let q = 0; q < 5; q++) if (bm[r][q] === '#') ctx.fillRect(x + o + q * p + 0.4, y + o + r * p + 0.4, p - 0.8, p - 0.8);
  ctx.globalAlpha = 1;
}
function block(x, y, color, inset = 1) { g.fillStyle = color; g.fillRect(x * cell + inset, y * cell + inset, cell - inset * 2, cell - inset * 2); }

function draw() {
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = cell * COLS;
  g.fillStyle = C.lcd; g.fillRect(0, 0, W, W);
  if (!S) { drawIdle(W); return; }
  const now = S.t;
  const sx = S.shake ? rnd(-S.shake, S.shake) * 0.3 : 0, sy = S.shake ? rnd(-S.shake, S.shake) * 0.3 : 0;
  g.save(); g.translate(sx, sy);

  // LCD sub-pixels
  g.fillStyle = C.off;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) g.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);

  // walls
  for (const k of S.walls) {
    const x = k % COLS, y = Math.floor(k / COLS);
    block(x, y, C.ink, 0.5);
    g.fillStyle = C.lcd; const q = cell / 3; g.fillRect(x * cell + q + 0.5, y * cell + q + 0.5, q - 1, q - 1);
  }
  // pits
  for (const p of S.pits) {
    const age = now - p.t0;
    if (!p.opened) { if (Math.floor(age / 150) % 2 === 0) sprite(g, SP.pitW, p.x * cell, p.y * cell, cell, C.danger); }
    else {
      const left = p.warn + p.open - age;
      if (left < 1200 && Math.floor(age / 100) % 2 === 0) sprite(g, SP.pit, p.x * cell, p.y * cell, cell, C.ink, 0.5);
      else { block(p.x, p.y, C.ink, 0); sprite(g, SP.pit, p.x * cell, p.y * cell, cell, C.lcd, 0.35); }
    }
  }
  // portal
  if (S.portal) {
    const f = Math.floor(now / 180) % 2 ? SP.portA : SP.portB;
    const blink = S.portal.until - now < 2000 && Math.floor(now / 120) % 2;
    if (!blink) { sprite(g, f, S.portal.a.x * cell, S.portal.a.y * cell, cell, C.amber); sprite(g, f, S.portal.b.x * cell, S.portal.b.y * cell, cell, C.amber); }
  }
  // food
  for (const f of S.food) {
    if (f.until && f.until - now < 2000 && Math.floor(now / 110) % 2) continue;
    sprite(g, SP.food, f.x * cell, f.y * cell, cell, C.ink);
  }
  // power-ups
  for (const p of S.powers) {
    if (p.until - now < 2000 && Math.floor(now / 110) % 2) continue;
    g.strokeStyle = C.amber; g.lineWidth = 1; g.strokeRect(p.x * cell + 0.5, p.y * cell + 0.5, cell - 1, cell - 1);
    sprite(g, SP[p.type], p.x * cell, p.y * cell, cell, C.amber);
  }
  // critter
  if (S.critter) {
    const c = S.critter;
    if (!(c.until - now < 2000 && Math.floor(now / 100) % 2)) sprite(g, Math.floor(now / 140) % 2 ? SP.bug1 : SP.bug2, c.x * cell, c.y * cell, cell, C.ink);
  }
  // bombs
  for (const b of S.bombs) {
    const left = b.at - now;
    const rate = left < 1000 ? 70 : left < 2200 ? 140 : 300;
    const hot = Math.floor(now / rate) % 2 === 0;
    const col = left < 2200 && hot ? C.danger : C.ink;
    sprite(g, hot ? SP.bomb : SP.bomb2, b.x * cell, b.y * cell, cell, col);
    if (left < 1600) { // show blast radius
      g.fillStyle = C.danger; g.globalAlpha = 0.12 + (hot ? 0.08 : 0);
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (Math.abs(dx) + Math.abs(dy) <= 2 && (dx || dy)) g.fillRect(wrap(b.x + dx, COLS) * cell, wrap(b.y + dy, ROWS) * cell, cell, cell);
      g.globalAlpha = 1;
    }
  }
  // snake
  const ghost = S.fx.ghost > 0, inv = S.fx.invuln > 0;
  const hide = (inv && Math.floor(now / 90) % 2) || (S.dyingUntil && Math.floor(now / 120) % 2);
  if (!hide) {
    for (let i = S.snake.length - 1; i >= 0; i--) {
      const s = S.snake[i];
      if (ghost) {
        g.strokeStyle = C.ink; g.lineWidth = Math.max(1.5, cell / 8);
        g.strokeRect(s.x * cell + 2, s.y * cell + 2, cell - 4, cell - 4);
        if (i === 0) block(s.x, s.y, C.ink, 2);
      } else block(s.x, s.y, C.ink, i === 0 ? 0.5 : 1.5);
      if (i === 0) { // eyes
        g.fillStyle = C.lcd; const e = Math.max(2, cell / 6);
        const [dx, dy] = S.dir; const cx = s.x * cell + cell / 2, cy = s.y * cell + cell / 2;
        const fx = dx * cell * 0.18, fy = dy * cell * 0.18, px = -dy * cell * 0.2, py = dx * cell * 0.2;
        g.fillRect(cx + fx + px - e / 2, cy + fy + py - e / 2, e, e);
        g.fillRect(cx + fx - px - e / 2, cy + fy - py - e / 2, e, e);
      }
    }
    if (S.shield > 0 && S.snake[0]) {
      const h = S.snake[0]; g.strokeStyle = C.amber; g.lineWidth = 2;
      g.beginPath(); g.arc(h.x * cell + cell / 2, h.y * cell + cell / 2, cell * 0.85, 0, Math.PI * 2); g.stroke();
    }
  }
  // blasts
  for (const b of S.blasts) {
    const a = 1 - (now - b.t0) / 450;
    for (const c of b.cells) {
      g.globalAlpha = Math.max(0, a); g.fillStyle = C.ink; g.fillRect(c.x * cell, c.y * cell, cell, cell);
      g.globalAlpha = Math.max(0, a) * 0.9; g.fillStyle = C.danger;
      const q = cell * (0.5 - 0.4 * a); g.fillRect(c.x * cell + q, c.y * cell + q, cell - 2 * q, cell - 2 * q);
    }
    g.globalAlpha = 1;
  }
  // score pops
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `700 ${Math.max(10, cell * 0.62)}px Silkscreen, monospace`;
  for (const p of S.pops) {
    const k = (now - p.t0) / 900;
    const x = Math.min(W - 30, Math.max(30, p.x * cell + cell / 2)), y = p.y * cell - k * cell * 1.6;
    g.globalAlpha = 1 - k * k;
    g.lineWidth = 3; g.strokeStyle = C.lcd; g.strokeText(p.text, x, y);
    g.fillStyle = p.bad ? C.danger : C.ink; g.fillText(p.text, x, y);
  }
  g.globalAlpha = 1;
  g.restore();

  // flash
  if (S.flash > 0) { g.fillStyle = C.ink; g.globalAlpha = Math.min(0.85, S.flash / 200); g.fillRect(0, 0, W, W); g.globalAlpha = 1; }
  // banner
  if (S.banner && now < S.banner.until) {
    const b = S.banner, h = cell * 3.2, y = W * 0.38;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = b.bad ? C.danger : C.ink; g.fillRect(0, y - h / 2, W, h + (b.sub ? cell * 1.2 : 0));
    g.fillStyle = C.lcd; g.font = `700 ${cell * 1.5}px Silkscreen, monospace`; g.fillText(b.text, W / 2, y);
    if (b.sub) { g.font = `400 ${cell * 0.75}px Silkscreen, monospace`; g.fillText(b.sub.toUpperCase(), W / 2, y + cell * 1.45); }
  }
  // combo meter
  if (S.combo > 1 && now - S.lastEat < 2600) {
    const k = 1 - (now - S.lastEat) / 2600;
    g.fillStyle = C.ink; g.fillRect(0, W - 3, W * k, 3);
  }
}

function drawIdle(W) {
  g.fillStyle = C.off;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) g.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);
}

function hud() {
  if (!S) return;
  document.getElementById('hudScore').textContent = String(S.score).padStart(5, '0') + (S.combo > 1 && S.t - S.lastEat < 2600 ? ' x' + S.combo : '');
  const hearts = '♥'.repeat(Math.max(0, S.lives)) + (S.shield ? ' ◈'.repeat(S.shield) : '');
  document.getElementById('hudLives').textContent = hearts + ' L' + S.level;
  const fx = [];
  if (S.fx.ghost > 0) fx.push(['GHOST ' + Math.ceil(S.fx.ghost / 1000), '']);
  if (S.fx.slow > 0) fx.push(['SLOW ' + Math.ceil(S.fx.slow / 1000), '']);
  if (S.fx.mirror > 0) fx.push(['MIRROR ' + Math.ceil(S.fx.mirror / 1000), 'bad']);
  if (S.fx.surge > 0) fx.push(['SURGE ' + Math.ceil(S.fx.surge / 1000), 'bad']);
  const el = document.getElementById('hudFx');
  const html = fx.map(([t, c]) => `<span class="${c}">${t}</span>`).join('');
  if (el.innerHTML !== html) el.innerHTML = html;
}

// ---------- loop ----------
let lastT = performance.now();
function frame(t) {
  const dt = Math.min(50, t - lastT); lastT = t;
  if (mode === 'play') { update(dt); hud(); }
  draw();
  requestAnimationFrame(frame);
}

// ---------- modes & UI ----------
const ovl = document.getElementById('ovl');
function setMode(m) {
  mode = m;
  document.getElementById('btnPause').textContent = m === 'pause' ? 'Resume' : 'Pause';
  if (m === 'play') { ovl.hidden = true; return; }
  ovl.hidden = false;
  if (m === 'pause') {
    ovl.innerHTML = `<h2>PAUSED</h2><p>Level ${S.level}, score ${S.score}.</p><button id="btnGo" type="button">Resume</button>`;
    document.getElementById('btnGo').onclick = () => setMode('play');
  } else if (m === 'over') {
    const rec = S.score >= best && S.score > 0;
    ovl.innerHTML = `<h2>GAME OVER</h2><p class="big">${S.score} pts${rec ? ' · NEW BEST' : ''}</p><p>Reached level ${S.level} with ${S.eaten} snacks eaten. Best: ${best}.</p>${familyLine()}<button id="btnGo" type="button">Play again</button>`;
    document.getElementById('btnGo').onclick = start;
    document.getElementById('btnGo').focus();
  }
}
function familyLine() {
  if (!family.on) return '';
  const capped = family.today >= FAMILY_CAP;
  return `<p class="big">${family.earned ? '+' + family.earned + ' family point' + (family.earned === 1 ? '' : 's') : 'No family points this game'}</p><p>${capped ? `You've hit today's ${FAMILY_CAP} point limit for Snake. Come back tomorrow.` : `Clear a level for 1 family point, up to ${FAMILY_CAP} a day. ${family.today}/${FAMILY_CAP} today.`}</p>`;
}
function start() { audio(); family.reset(); newGame(); setMode('play'); banner('LEVEL 1', MAZES[0].name, 1400); SFX.level(); }

document.getElementById('btnStart').onclick = start;
document.getElementById('ovlBest').textContent = best ? 'BEST ' + best : '';
document.getElementById('btnPause').onclick = () => { if (mode === 'play') setMode('pause'); else if (mode === 'pause') setMode('play'); };
const btnSound = document.getElementById('btnSound');
function syncSound() { btnSound.textContent = soundOn ? '♪ On' : '♪ Off'; btnSound.setAttribute('aria-pressed', String(soundOn)); }
btnSound.onclick = () => { soundOn = !soundOn; store.set('sm-sound', soundOn ? 'on' : 'off'); syncSound(); if (soundOn) beep(880, 0.05); };
syncSound();

const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
window.addEventListener('keydown', e => {
  if (KEYS[e.key]) { e.preventDefault(); turn(KEYS[e.key]); return; }
  if (e.key === ' ' || e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
    e.preventDefault();
    if (mode === 'play') setMode('pause'); else if (mode === 'pause') setMode('play'); else if (e.key === ' ') start();
  }
  if (e.key === 'Enter' && (mode === 'title' || mode === 'over')) start();
  if (e.key === 'm' || e.key === 'M') btnSound.click();
});

// swipe on the screen: re-arms mid-drag so you can carve quick turns without lifting
let sw = null;
cv.addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY }; audio(); });
cv.addEventListener('pointermove', e => {
  if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  sw = { x: e.clientX, y: e.clientY };
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => { sw = null; }));

document.querySelectorAll('.pad button').forEach(b => {
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); audio();
    const d = b.dataset.d;
    if (d === 'pause') { if (mode === 'play') setMode('pause'); else if (mode === 'pause') setMode('play'); else start(); }
    else turn(d);
    b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 120);
  });
});

document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') setMode('pause'); });
window.addEventListener('blur', () => { if (mode === 'play') setMode('pause'); });
window.addEventListener('resize', resize);

// field guide
const GUIDE = [
  ['food', C.ink, 'Snack', 'Eat within 2.6s of the last one to stack a combo up to x9.'],
  ['bomb', C.danger, 'Bomb', 'Blows a diamond 2 squares wide, smashing walls and severing your tail. Drive over it first to defuse it for points.'],
  ['pit', C.ink, 'Sinkhole', 'Flashes red, then opens. Fall in and you lose a life. If it opens under your body, you lose the tail.'],
  ['portA', C.amber, 'Wormhole', 'Paired holes. Enter one and pop out of the other.'],
  ['bug1', C.ink, 'Bug', 'Shows up every 5 snacks and scuttles around. The faster you catch it, the more it pays.'],
  ...POWER_TYPES.map(t => [t, C.amber, POWERS[t].label[0] + POWERS[t].label.slice(1).toLowerCase(), POWERS[t].desc]),
];
const ul = document.getElementById('guide');
for (const [sp, col, name, desc] of GUIDE) {
  const li = document.createElement('li'), c = document.createElement('canvas');
  c.width = c.height = 60; const x = c.getContext('2d');
  x.fillStyle = C.lcd; x.fillRect(0, 0, 60, 60);
  if (sp === 'pit') { x.fillStyle = C.ink; x.fillRect(0, 0, 60, 60); sprite(x, SP.pit, 0, 0, 60, C.lcd, 0.35); }
  else sprite(x, SP[sp], 0, 0, 60, col);
  const t = document.createElement('div'); t.innerHTML = `<b>${name}.</b> ${desc}`;
  li.append(c, t); ul.append(li);
}
const chaosLi = document.createElement('li');
chaosLi.innerHTML = '<div><b>Chaos events.</b> Every 20 seconds or so: bomb rain, mirrored controls, speed surges, earthquakes that shove the walls, and sinkhole swarms. Every 8 snacks the maze changes.</div>';
ul.append(chaosLi);

resize();
requestAnimationFrame(frame);
window.__snake = { get S() { return S; }, get mode() { return mode; }, start, turn };
})();
</script>
</body>
</html>
